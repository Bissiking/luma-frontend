server {
    listen 80;
    server_name dev.mhemery.fr dev.entreprise.mhemery.fr;
    root "C:/laragon/www/Luma/luma-frontend";  # Point d'entrée direct vers le frontend

    index index.php;

    # Bloc principal pour rediriger toutes les requêtes vers index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Accès aux ressources statiques - CONFIGURATION SIMPLIFIÉE
    location ^~ /assets/ {
        # Chemin direct vers le dossier assets
        root "C:/laragon/www/Luma/luma-frontend";
        
        # Désactivation du logging des accès
        access_log off;
        
        # Activation de l'autoindex pour le débogage
        autoindex on;
        
        # Expiration et cache simples
        expires 7d;
        add_header Cache-Control "public";
        
        # Types MIME
        include mime.types;
        default_type application/octet-stream;
    }

    # Protection des fichiers sensibles
    location ~* ^/(core|init-bdd|luma-api)/.*\.php$ {
        deny all;
    }

    # Bloquer l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
    }

    # Bloquer les accès aux fichiers spécifiques
    location ~* \.(env|json|lock|config|sql|backup|bak|md)$ {
        deny all;
    }

    # Gestion des erreurs personnalisées
    error_page 404 /views/errors/404.html;
    location = /views/errors/404.html {
        internal;
    }

    error_page 500 502 503 504 /views/errors/50x.html;
    location = /views/errors/50x.html {
        internal;
        error_log C:/laragon/bin/nginx/nginx-1.22.0/logs/nginx_error.log;
    }

    # Traitement PHP
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass php_upstream;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_intercept_errors on;
    }

    # Logs d'erreur
    error_log C:/laragon/bin/nginx/nginx-1.22.0/logs/error.log;
    
    # Compression Gzip globale
    gzip on;
    gzip_types text/css application/javascript;

    # Limiter la taille des fichiers uploadés
    client_max_body_size 10G;
}